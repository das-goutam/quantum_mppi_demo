[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qmppi"
version = "0.1.0"
description = "End-to-end MPPI control with samples drawn from a quantum circuit (simulated)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "qiskit>=1.2", "qiskit-aer>=0.15", "pylatexenc"]

[tool.setuptools]
packages = ["qmppi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
